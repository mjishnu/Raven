name: Apply home run folder polish
on:
  push:
    branches: [feature/gui-install-run-folder-path]
    paths: [.github/workflows/apply-home-run-folder-polish.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gui-install-run-folder-path
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - shell: pwsh
        run: python .github/scripts/apply-home-run-folder-polish.py
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raven/Views/AppPage.xaml.cs Raven/Helpers/PortableMsixLauncher.cs Raven/Helpers/NativeFilePicker.cs
          git commit -m "Polish Run behavior and portable folder picker"
          git push
