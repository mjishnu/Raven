name: Apply MSIX Extraction Hotfix

on:
  push:
    branches:
      - hotfix/msix-portable-extraction
    paths:
      - ".github/workflows/hotfix-msix-extraction.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/msix-portable-extraction

      - name: Patch portable extraction and picker cleanup
        shell: pwsh
        run: |
          $launcherPath = 'Raven/Helpers/PortableMsixLauncher.cs'
          $launcher = Get-Content $launcherPath -Raw

          $launcherPattern = '(?s)        if \(Directory\.Exists\(root\)\)\r?\n        \{.*?        Directory\.CreateDirectory\(depsDir\);'
          $launcherReplacement = @'
        Directory.CreateDirectory(root);

        // Keep the selected root folder itself intact. Only replace Raven-owned payload folders.
        foreach (var ownedDirectory in new[] { appDir, depsDir })
        {
            if (!Directory.Exists(ownedDirectory))
                continue;

            try
            {
                Directory.Delete(ownedDirectory, recursive: true);
            }
            catch (Exception ex)
            {
                throw new IOException(
                    $"The existing portable application files could not be replaced. Close the portable app if it is still running and try again. Folder: {ownedDirectory}",
                    ex
                );
            }
        }

        Directory.CreateDirectory(appDir);
        Directory.CreateDirectory(depsDir);
'@

          $patchedLauncher = [regex]::Replace($launcher, $launcherPattern, $launcherReplacement, 1)
          if ($patchedLauncher -eq $launcher) { throw 'PortableMsixLauncher regex did not match.' }
          Set-Content $launcherPath $patchedLauncher -Encoding utf8NoBOM

          $pickerPath = 'Raven/Helpers/NativeFilePicker.cs'
          $picker = Get-Content $pickerPath -Raw
          $pickerPattern = '(?s)            dialog\.GetResult\(out var item\);\r?\n            item\.GetDisplayName\(SIGDN_FILESYSPATH, out var path\);\r?\n            return string\.IsNullOrEmpty\(path\)\r?\n                \? Array\.Empty<string>\(\)\r?\n                : new\[\] \{ path \};'
          $pickerReplacement = @'
            dialog.GetResult(out var item);
            try
            {
                item.GetDisplayName(SIGDN_FILESYSPATH, out var path);
                return string.IsNullOrEmpty(path)
                    ? Array.Empty<string>()
                    : new[] { path };
            }
            finally
            {
                Marshal.ReleaseComObject(item);
            }
'@

          $patchedPicker = [regex]::Replace($picker, $pickerPattern, $pickerReplacement, 1)
          if ($patchedPicker -eq $picker) { throw 'NativeFilePicker regex did not match.' }
          Set-Content $pickerPath $patchedPicker -Encoding utf8NoBOM

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raven/Helpers/PortableMsixLauncher.cs Raven/Helpers/NativeFilePicker.cs
          git commit -m "Fix portable MSIX extraction after folder selection"
          git push origin HEAD:hotfix/msix-portable-extraction
