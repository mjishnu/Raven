name: Apply MSIX Extraction Hotfix

on:
  push:
    branches:
      - hotfix/msix-portable-extraction
    paths:
      - ".github/workflows/hotfix-msix-extraction.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/msix-portable-extraction

      - name: Patch portable extraction and picker cleanup
        shell: pwsh
        run: |
          $launcherPath = 'Raven/Helpers/PortableMsixLauncher.cs'
          $launcher = Get-Content $launcherPath -Raw

          $old = @'
          if (Directory.Exists(root))
          {
              try
              {
                  Directory.Delete(root, recursive: true);
              }
              catch (Exception ex)
              {
                  throw new IOException(
                      $"The existing portable folder could not be replaced. Close the portable app if it is still running and try again. Folder: {root}",
                      ex
                  );
              }
          }

          Directory.CreateDirectory(appDir);
          Directory.CreateDirectory(depsDir);
          '@

          $new = @'
          Directory.CreateDirectory(root);

          // Keep the user-selected root folder itself intact. In particular, do not delete the
          // folder that the native shell picker has just returned. Only replace Raven's own
          // extracted payload subdirectories.
          foreach (var ownedDirectory in new[] { appDir, depsDir })
          {
              if (!Directory.Exists(ownedDirectory))
                  continue;

              try
              {
                  Directory.Delete(ownedDirectory, recursive: true);
              }
              catch (Exception ex)
              {
                  throw new IOException(
                      $"The existing portable application files could not be replaced. Close the portable app if it is still running and try again. Folder: {ownedDirectory}",
                      ex
                  );
              }
          }

          Directory.CreateDirectory(appDir);
          Directory.CreateDirectory(depsDir);
          '@

          if (-not $launcher.Contains($old)) { throw 'PortableMsixLauncher patch anchor not found.' }
          $launcher = $launcher.Replace($old, $new)
          Set-Content $launcherPath $launcher -Encoding utf8NoBOM

          $pickerPath = 'Raven/Helpers/NativeFilePicker.cs'
          $picker = Get-Content $pickerPath -Raw

          $oldPicker = @'
          dialog.GetResult(out var item);
          item.GetDisplayName(SIGDN_FILESYSPATH, out var path);
          return string.IsNullOrEmpty(path)
              ? Array.Empty<string>()
              : new[] { path };
          '@

          $newPicker = @'
          dialog.GetResult(out var item);
          try
          {
              item.GetDisplayName(SIGDN_FILESYSPATH, out var path);
              return string.IsNullOrEmpty(path)
                  ? Array.Empty<string>()
                  : new[] { path };
          }
          finally
          {
              Marshal.ReleaseComObject(item);
          }
          '@

          if (-not $picker.Contains($oldPicker)) { throw 'NativeFilePicker patch anchor not found.' }
          $picker = $picker.Replace($oldPicker, $newPicker)
          Set-Content $pickerPath $picker -Encoding utf8NoBOM

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raven/Helpers/PortableMsixLauncher.cs Raven/Helpers/NativeFilePicker.cs
          git commit -m "Fix portable MSIX extraction after folder selection"
          git push origin HEAD:hotfix/msix-portable-extraction
