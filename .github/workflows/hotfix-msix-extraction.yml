name: Apply MSIX Extraction Hotfix

on:
  push:
    branches:
      - hotfix/msix-portable-extraction
    paths:
      - ".github/workflows/hotfix-msix-extraction.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/msix-portable-extraction

      - name: Apply source patch
        shell: pwsh
        run: python tools/hotfix_msix_extraction.py

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raven/Views/AppPage.xaml.cs Raven/Helpers/PortableMsixLauncher.cs Raven/Helpers/NativeFilePicker.cs
          git commit -m "Fix portable MSIX extraction and Run detection"
          git push origin HEAD:hotfix/msix-portable-extraction
