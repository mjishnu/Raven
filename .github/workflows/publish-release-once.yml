name: Publish Raven Release Once

on:
  push:
    branches:
      - feature/gui-install-run-folder-path
    paths:
      - ".github/workflows/publish-release-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated x64 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/x64
          gh run download 31339631866 \
            --repo "${{ github.repository }}" \
            --name Raven-Windows-x64 \
            --dir release-assets/x64

      - name: Download validated ARM64 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/arm64
          gh run download 31339631866 \
            --repo "${{ github.repository }}" \
            --name Raven-Windows-arm64 \
            --dir release-assets/arm64

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # ⚠️ Important license and liability notice

          **Only use Raven for applications and packages that you own or for which you have a valid license or other legal right to use.**

          **I explicitly advise against downloading, installing, extracting, launching, or otherwise using paid applications without a valid license.** The ability to download or extract an application package does not grant a license to use that application.

          You are solely responsible for ensuring that your use complies with the applicable software license terms, Microsoft Store terms, copyright law, and other applicable laws and agreements.

          **The maintainer assumes no responsibility or liability for unauthorized use, license violations, copyright infringement, data loss, system damage, financial loss, account restrictions, or other consequences resulting from the use or misuse of this software, to the maximum extent permitted by applicable law. Use this software at your own risk.**

          ## Raven Portable / Installer fork

          This release is based on Raven and expands the portable MSIX/AppX workflow for packages you own or are licensed to use. It also replaces the previous SFX-style distribution with normal self-contained OneDir builds and WiX installers.

          ### Changes in this release
          - Add separate **Install**, **Run**, and **Download** actions for supported packages.
          - Add unpackaged/portable execution for compatible MSIX/AppX applications without registering the package.
          - Allow choosing the portable storage location, defaulting to `%LOCALAPPDATA%\Raven\PortableApps` with the application name pre-filled.
          - Reuse an existing portable installation when **Run** is selected instead of downloading and extracting it again.
          - Persist the portable executable path so **Open** can launch an already extracted application.
          - Add an option to disable package registration and add the unpackaged application directory to the user's PATH.
          - Create Start menu integration for portable applications where supported.
          - Remove the home-page banner for a cleaner UI.
          - Provide self-contained **x64** and **ARM64** OneDir ZIP builds.
          - Provide normal **WiX 4 MSI installers** for x64 and ARM64 instead of relying on a self-extracting single-file wrapper.

          ### Compatibility note

          Portable execution only works for applications that can actually run unpackaged. Traditional Win32 applications wrapped in MSIX often work, while UWP/AppX applications may require package identity, registration, frameworks, services, drivers, or other Windows integration and therefore may not run in portable mode.

          ### License reminder

          **Do not use this project to install or run paid software without a valid license. I strongly advise against doing so.** Package extraction does not grant a software license and does not make every MSIX/AppX application portable.

          The maintainer does not authorize or encourage software piracy, circumvention of payment obligations, copyright infringement, or use of paid applications without a valid license.

          ### Downloads

          - `Raven-Setup-x64.msi` — normal Windows x64 installer.
          - `Raven-Setup-arm64.msi` — normal Windows ARM64 installer.
          - `Raven-OneDir-x64.zip` — self-contained portable x64 build.
          - `Raven-OneDir-arm64.zip` — self-contained portable ARM64 build.
          - Matching `.sha256.txt` files are included for verification.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0.0-portable.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; nothing to do."
            exit 0
          fi

          gh release create v1.1.0.0-portable.2 \
            release-assets/x64/* \
            release-assets/arm64/* \
            --repo "${{ github.repository }}" \
            --target bc3e44c80055263a036b80a8785b867d844f4248 \
            --title "Raven Portable v1.1.0.0-portable.2" \
            --notes-file release-notes.md
