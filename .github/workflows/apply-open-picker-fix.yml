name: Apply Open and picker fix
on:
  push:
    branches: [feature/gui-install-run-folder-path]
    paths: [.github/workflows/apply-open-picker-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gui-install-run-folder-path
      - shell: pwsh
        run: ./.github/scripts/fix-open-and-picker.ps1
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raven/Views/AppPage.xaml.cs Raven/Helpers/PortableMsixLauncher.cs Raven/Helpers/NativeFilePicker.cs
          git commit -m "Fix Open for portable apps and default folder picker" 
          git push
